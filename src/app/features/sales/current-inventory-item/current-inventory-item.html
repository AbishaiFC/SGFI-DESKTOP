<mat-card>
    <mat-card-header>
        <mat-card-title>{{product.name}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-chip-set>
            <mat-chip>{{product.price | currency}}</mat-chip>
        </mat-chip-set>
    </mat-card-content>
    <mat-card-footer>
        <button mat-icon-button (click)="readBarcode(product.barcode)">
            <mat-icon class="material-icons-outlined" fontIcon="shopping_cart"></mat-icon>
        </button>
    </mat-card-footer>
</mat-card>
