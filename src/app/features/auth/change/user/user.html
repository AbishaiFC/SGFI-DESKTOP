<div class="page">
    <app-title [icon]=false title="Cambiar Usuario"/>
    
    <app-gray-card>
        <form [formGroup]="userForm">
            <app-custom-input formControlName="username" label="Nombre de Usuario" typeValue="text" placeholder="usuario" prefixIcon="person"/>
            <div class="button">
                <app-button icon="save" title="Guardar cambios" type="submit"/>
            </div>
        </form>
    </app-gray-card>

    <section>
        <a routerLink="/dashboard/settings">Cancelar</a>
    </section>
</div>
