<div class="page">
    <app-title [icon]=false title="Cambiar Contraseña"/>
    
    <app-gray-card>
        <form [formGroup]="passwordForm">
            <app-custom-input formControlName="oldPassword" label="Contraseña Actual" typeValue="password" placeholder="Mínimo 6 caracteres" prefixIcon="lock" [isPassword]="true"/>
            <app-custom-input formControlName="newPassword" label="Nueva Contraseña" typeValue="password" placeholder="Mínimo 6 caracteres" prefixIcon="lock" [isPassword]="true"/>
            <div class="button">
                <app-button icon="save" title="Guardar cambios" type="submit"/>
            </div>
        </form>
    </app-gray-card>

    <section>
        <a routerLink="/dashboard/settings">Cancelar</a>
    </section>
</div>
