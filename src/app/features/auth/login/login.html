<div class="page">
    <app-title [icon]=false title="Iniciar Sesión"/>
    
    <app-gray-card>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <app-custom-input formControlName="email" label="Correo electrónico" typeValue="email" placeholder="ejemplo@correo.com" prefixIcon="email"/>
            <app-custom-input formControlName="password" label="Contraseña" typeValue="password" placeholder="Mínimo 6 caracteres" prefixIcon="lock"/>
            <div class="forgot">
                <p>¿Olvidaste tu contraseña?</p>
                <a routerLink="/forgot-password">Click aquí</a>
            </div> 
        </form>
        <div class="button">
            <app-button routerLink="/dashboard" icon="send" title="Inicio"/>
        </div>
    </app-gray-card>

    <section>
        <p>¿No tienes una cuenta?</p>
        <a routerLink="/register">Crea una aquí</a>
    </section>

    <app-redirect-button icon="chevron_left" position="left" routerLink="/current"/>
</div>
