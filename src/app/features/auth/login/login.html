<div class="page">
    <app-title [icon]=false title="Iniciar Sesión"/>
    
    <app-gray-card>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <app-custom-input formControlName="email" label="Correo electrónico" typeValue="email" placeholder="ejemplo@correo.com" prefixIcon="email" errorMessage="Correo no válido"/>
            <app-custom-input formControlName="password" label="Contraseña" placeholder="Mínimo 6 caracteres" prefixIcon="lock" [isPassword]="true" errorMessage="Contraseña demasiado corta"/>
            <div class="forgot">
                <p>¿Olvidaste tu contraseña?</p>
                <a routerLink="/forgot-password">Click aquí</a>
            </div> 
            <div class="button">
                <app-button icon="send" title="Inicio" [disabled]="loginForm.invalid" [loading]="formState.state().status === 'loading'" type="submit"/>
            </div>
        </form>
    </app-gray-card>

    <section>
        <p>¿No tienes una cuenta?</p>
        <a routerLink="/register">Crea una aquí</a>
    </section>

    <app-redirect-button icon="chevron_left" position="left" routerLink="/current"/>
</div>
