<div class="page">
    <app-title [icon]=false title="Cambiar Contraseña"/>
    
    <app-gray-card>
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
            <app-custom-input formControlName="email" label="Correo electrónico" typeValue="email" placeholder="ejemplo@correo.com" prefixIcon="email"/>
        </form>
        <div class="button">
            <app-button icon="send" title="Enviar correo"/>
        </div>
    </app-gray-card>

    <section>
        <a routerLink="/login">Cancelar</a>
    </section>

    <app-redirect-button icon="chevron_left" position="left" routerLink="/current"/>
</div>
