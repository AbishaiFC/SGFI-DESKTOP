<div class="page">
    <app-title [icon]=false title="Cambiar Contraseña"/>
    
    <app-gray-card>
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
            <app-custom-input formControlName="email" label="Correo electrónico" typeValue="email" placeholder="ejemplo@correo.com" prefixIcon="email" errorMessage="Correo no válido"/>
            <div class="button">
                <app-button icon="send" title="Enviar correo" [disabled]="forgotForm.invalid" [loading]="formState.state().status === 'loading'" type="submit"/>
            </div>
        </form>
    </app-gray-card>

    <section>
        <a routerLink="/login">Cancelar</a>
    </section>

    <app-redirect-button icon="chevron_left" position="left" routerLink="/current"/>
</div>
