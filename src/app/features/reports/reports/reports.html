<div class="page">
    <div class="table">
        @if(sales()){
            <app-table [sales]="sales()!"/>
        }@else {
            <app-empty-table />
        }
    </div>
    <div class="chart">
        @if(reportsSales()){
            <app-chart [sales]="reportsSales()!"/>
        }@else {
            <app-empty-chart />
        }
        <app-excel-format (dateRange)="onSelectedDates($event)" [salesLength]="reportsSales()?.length ?? 0" />
    </div>
</div>
