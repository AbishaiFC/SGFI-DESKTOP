@let accountData = authStore.account();

<app-white-card>
    <section>
        <div>
            <strong>Administrador</strong>
            <p>{{accountData?.full_name ?? 'Admin'}}</p>
        </div>
        <button mat-icon-button routerLink="/user">
            <mat-icon class="material-icons-outlined" fontIcon="edit"></mat-icon>
        </button>
    </section>
    <section>
        <div>
            <strong>Correo Electrónico</strong>
            <p>{{accountData?.email ?? 'example@gmail.com'}}</p>
        </div>
        <button mat-icon-button routerLink="/email">
            <mat-icon class="material-icons-outlined" fontIcon="edit"></mat-icon>
        </button>
    </section>
    <section>
        <div>
            <strong>Contraseña</strong>
            <p>*******</p>
        </div>
        <button mat-icon-button routerLink="/password">
            <mat-icon class="material-icons-outlined" fontIcon="edit"></mat-icon>
        </button>
    </section>
    <div class="button">
        <app-button icon="delete" title="Eliminar cuenta" color="accent"/>
    </div>
</app-white-card>
