<app-white-card color="accent">
    <app-title-card title="Productos con stock bajo (-8 existencias)" color="accent"/>
    <table mat-table [dataSource]="dataSource" matSort>
        <!-- Barcode Column -->
        <ng-container matColumnDef="barcode">
            <th mat-header-cell *matHeaderCellDef>Barcode</th>
            <td mat-cell *matCellDef="let element">{{element.barcode}}</td>
        </ng-container>
        <!-- Product Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
        </ng-container>
        <!-- Price Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
            <td mat-cell *matCellDef="let element">{{element.price | currency}}</td>
        </ng-container>
        <!-- Stock Column -->
        <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
            <td mat-cell *matCellDef="let element" class="low-stock">{{element.stock}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSize]="3" showFirstLastButtons aria-label="Seleccionar página"></mat-paginator>
</app-white-card>
