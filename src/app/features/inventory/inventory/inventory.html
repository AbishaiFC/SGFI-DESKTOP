@let inventoryData = inventoryStore.products();

<div class="page">
    <div class="table">
        @if (inventoryData === null) {
            <app-empty-table />
        }@else {
            <app-table [products]="inventoryData" (editProduct)="onEditProduct($event)" />
        }
    </div>
    <div class="form">
        <app-form [editProduct]="editProduct"/>
    </div>
</div>
