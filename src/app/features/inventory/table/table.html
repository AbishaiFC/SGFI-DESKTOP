<table mat-table [dataSource]="dataSource" matSort>
    <!-- Barcode Column -->
    <ng-container matColumnDef="barcode">
        <th mat-header-cell *matHeaderCellDef>Barcode</th>
        <td mat-cell *matCellDef="let element">{{element.barcode}}</td>
    </ng-container>
    <!-- Product Column -->
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>
    <!-- Price Column -->
    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
        <td mat-cell *matCellDef="let element">{{element.price | currency}}</td>
    </ng-container>
    <!-- Stock Column -->
    <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
        <td mat-cell *matCellDef="let element" [class.low-stock]="isLowStock(element.stock)">{{element.stock}}</td>
    </ng-container>
    
    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
            <div>
                <button mat-icon-button  class="edit" (click)="onEdit(element)">
                    <mat-icon class="material-icons-outlined" fontIcon="edit"></mat-icon>
                </button>
                <button mat-icon-button  class="delete" (click)="onDelete(element)">
                    <mat-icon class="material-icons-outlined" fontIcon="delete"></mat-icon>
                </button>
            </div>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
<mat-paginator [pageSize]="10" showFirstLastButtons aria-label="Seleccionar página"></mat-paginator>
