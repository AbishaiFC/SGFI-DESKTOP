@let accountData = authStore.account();
@let pageData = { title: title(), subtitle: subtitle() };

<div class="main-container">
    <section class="title">
        <h2>{{ pageData.title }}</h2>
        <p>{{ pageData.subtitle }}</p>
    </section>
    <section class="user">
        <mat-icon class="material-icons-outlined" fontIcon="person" routerLink="/dashboard/settings"></mat-icon>
        <p>{{ accountData?.full_name ?? 'Usuario' }}</p>
    </section>
</div>
