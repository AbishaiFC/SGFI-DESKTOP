@if (!loading) {
    <!-- Estado normal -->
    <button 
        mat-fab 
        extended 
        [class]="color"
        [disabled]="disabled"
        [type]="type"
        (click)="onClick($event)"
        >
        <mat-icon [fontIcon]="icon"></mat-icon>
        {{title}}   
        
    </button>
}@else {
    <!-- Estado de carga -->
    <div>
        <span class="loader"></span>
    </div>
}
