<mat-form-field appearance="outline">

  <!-- Nombre del dato solicitado -->
  <mat-label>{{ label }}</mat-label>

  <!-- Icono de la izquierda para asociación -->
  @if (prefixIcon != "") {
    <mat-icon
        matIconPrefix
        class="material-icons-outlined prefix"
        [fontIcon]="prefixIcon"
    ></mat-icon>
  }

  <!-- Input de datos -->
  <input
    matInput
    [type]="effectiveType"
    [placeholder]="placeholder"
    [value]="viewValue"
    (input)="onInputChange($event)"
    (blur)="onBlur()"
    [disabled]="disabled"
  />

  <!-- Icono derecho con acción (solo en caso de contraseña)-->
  @if (effectiveSuffixIcon != "") {
    <button 
      class="suffix"
      mat-icon-button 
      matSuffix 
      type="button"
      (click)="onSuffixClick()"
      [disabled]="disabled"
    >
      <mat-icon class="material-icons-outlined">{{ effectiveSuffixIcon }}</mat-icon>  <!-- Simplifiqué, asumiendo icons de texto como 'visibility' -->
    </button>
  }

  <!-- Mensaje de error para el Usuario -->
  @if (hasError) {
    <mat-error>{{errorMessage || 'Campo inválido'}}</mat-error>
  }
</mat-form-field>
