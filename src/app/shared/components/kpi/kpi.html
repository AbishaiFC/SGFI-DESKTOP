<app-white-card>
    <div class="card">
        <mat-icon class="material-icons-outlined main-icon" [fontIcon]="icon"></mat-icon>
        <div class="trending" [ngClass]="trendClass()">
            <mat-icon class="material-icons-outlined" [fontIcon]="trendIcon()"></mat-icon>
            {{percentageChange()}}%
        </div>
    </div>
    <h2>{{title}}</h2>
    <p>{{formattedValue()}}</p>
</app-white-card>
